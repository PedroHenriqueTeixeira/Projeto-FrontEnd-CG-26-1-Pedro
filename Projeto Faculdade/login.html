<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberShield - Login</title>

    <!-- Arquivo de estilos compartilhado -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <!-- Logo -->
        <a href="index.html" class="logo">
            CyberShield
        </a>

        <!-- Navegação -->
        <nav>

            <a href="index.html">Início</a>

            <a href="servicos.html">Serviços</a>

            <a href="cadastro.html">Cadastro</a>

        </nav>

    </header>

    <!-- Área principal -->
    <main class="form-container">

        <form id="loginForm">

            <h1>
                Entrar
            </h1>

            <!-- Mensagens de erro -->
            <span id="msg" class="erro"></span>

            <!-- CPF -->
            <input
                type="text"
                id="cpf"
                placeholder="CPF"
                maxlength="14"
                required>

            <!-- Senha -->
            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required>

            <button>
                Entrar
            </button>

        </form>

    </main>

    <!-- Rodapé -->
    <footer>

        CyberShield © 2026

    </footer>

    <script>

        // Impede abrir a página de login caso já exista uma sessão

        if(localStorage.getItem("usuarioLogado")){

            window.location = "index.html";

        }

        const cpfInput =
            document.getElementById("cpf");

        const msg =
            document.getElementById("msg");

        // Formata o CPF automaticamente

        cpfInput.addEventListener("input", () => {

            let valor =
                cpfInput.value.replace(/\D/g,'');

            valor =
                valor.replace(
                    /(\d{3})(\d)/,
                    "$1.$2"
                );

            valor =
                valor.replace(
                    /(\d{3})(\d)/,
                    "$1.$2"
                );

            valor =
                valor.replace(
                    /(\d{3})(\d{1,2})$/,
                    "$1-$2"
                );

            cpfInput.value = valor;

        });

        // Processa o login

        document
            .getElementById("loginForm")
            .addEventListener("submit", (e) => {

            e.preventDefault();

            msg.innerText = "";

            const cpf =
                cpfInput.value;

            const senha =
                document.getElementById("senha").value;

            const usuarios =
                JSON.parse(
                    localStorage.getItem("usuarios")
                ) || [];

            const usuario =
                usuarios.find(u =>
                    u.cpf === cpf &&
                    u.senha === senha
                );

            // Verifica se encontrou usuário

            if(!usuario){

                msg.innerText =
                    "CPF ou senha incorretos.";

                return;

            }

            // Cria a sessão

            localStorage.setItem(
                "usuarioLogado",
                JSON.stringify({

                    nome:
                        usuario.nome,

                    cpf:
                        usuario.cpf

                })
            );

            // Retorna para a página inicial

            window.location =
                "index.html";

        });

    </script>

</body>

</html>
