<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - CyberShield</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1220;
color:white;
min-height:100vh;
display:flex;
flex-direction:column;
}

header{

background:#111827;

padding:20px 8%;

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:2px solid #00c3ff;

}

.logo{

font-size:28px;

font-weight:bold;

color:#00c3ff;

}

nav{

display:flex;

gap:15px;

flex-wrap:wrap;

}

nav a{

text-decoration:none;

color:white;

}

main{

flex:1;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}

form{

background:#111827;

padding:35px;

border-radius:12px;

width:100%;

max-width:450px;

display:grid;

gap:14px;

}

input{

padding:12px;

border:none;

border-radius:8px;

outline:none;

}

button{

padding:14px;

border:none;

border-radius:8px;

background:#00c3ff;

font-weight:bold;

cursor:pointer;

}

.erro{

color:#ff6b6b;

}

footer{

padding:20px;

text-align:center;

background:#111827;

border-top:2px solid #00c3ff;

}

</style>

</head>

<body>

<header>

<div class="logo">
CyberShield
</div>

<nav>

<a href="index.html">
Início
</a>

<a href="cadastro.html">
Cadastro
</a>

<a href="servicos.html">
Serviços
</a>

</nav>

</header>

<main>

<form id="loginForm">

<h1>
Entrar
</h1>

<span id="msg" class="erro"></span>

<input
type="text"
id="cpf"
placeholder="CPF"
maxlength="14"
required>

<input
type="password"
id="senha"
placeholder="Senha"
required>

<button>

Entrar

</button>

</form>

</main>

<footer>

CyberShield © 2026

</footer>

<script>

if(
localStorage.getItem(
"usuarioLogado"
)
){

window.location =
"index.html";

}



const cpfInput =
document.getElementById(
"cpf"
);

cpfInput.addEventListener(
"input",
()=>{

let valor =
cpfInput.value.replace(
/\D/g,
''
);

valor =
valor.replace(
/(\d{3})(\d)/,
"$1.$2"
);

valor =
valor.replace(
/(\d{3})(\d)/,
"$1.$2"
);

valor =
valor.replace(
/(\d{3})(\d{1,2})$/,
"$1-$2"
);

cpfInput.value =
valor;

}
);



document.getElementById(
"loginForm"
).addEventListener(
"submit",
(e)=>{

e.preventDefault();

const msg =
document.getElementById(
"msg"
);

msg.innerText="";

const cpf =
cpfInput.value;

const senha =
document.getElementById(
"senha"
).value;

const usuarios =
JSON.parse(

localStorage.getItem(
"usuarios"
)

) || [];

const usuario =
usuarios.find(

u =>

u.cpf === cpf

&&

u.senha === senha

);

if(
!usuario
){

msg.innerText =
"CPF ou senha incorretos";

return;

}

localStorage.setItem(

"usuarioLogado",

JSON.stringify({

nome:
usuario.nome,

cpf:
usuario.cpf

})

);

window.location =
"index.html";

});

</script>

</body>
</html>
