<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberShield - Cadastro</title>

    <!-- Arquivo de estilos -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <!-- Logo -->
        <a href="index.html" class="logo">
            CyberShield
        </a>

        <!-- Menu -->
        <nav>

            <a href="index.html">Início</a>

            <a href="servicos.html">Serviços</a>

            <a href="login.html">Login</a>

        </nav>

    </header>

    <!-- Conteúdo principal -->
    <main class="form-container">

        <form id="cadastroForm">

            <h1>
                Cadastro
            </h1>

            <!-- Mensagem geral -->
            <span id="msg" class="erro"></span>

            <!-- Nome -->
            <input
                type="text"
                id="nome"
                placeholder="Nome completo"
                required>

            <!-- CPF -->
            <input
                type="text"
                id="cpf"
                placeholder="CPF"
                maxlength="14"
                required>

            <small id="cpfMsg"></small>

            <!-- CEP -->
            <input
                type="text"
                id="cep"
                placeholder="CEP"
                maxlength="9"
                required>

            <small id="cepMsg"></small>

            <!-- Endereço preenchido automaticamente -->
            <input
                type="text"
                id="endereco"
                placeholder="Endereço"
                readonly>

            <input
                type="text"
                id="bairro"
                placeholder="Bairro"
                readonly>

            <input
                type="text"
                id="cidade"
                placeholder="Cidade"
                readonly>

            <input
                type="text"
                id="uf"
                placeholder="UF"
                readonly>

            <!-- Informações complementares -->
            <input
                type="text"
                id="numero"
                placeholder="Número"
                required>

            <input
                type="text"
                id="complemento"
                placeholder="Complemento">

            <!-- Senha -->
            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required>

            <input
                type="password"
                id="confirmar"
                placeholder="Confirmar senha"
                required>

            <button>
                Cadastrar
            </button>

        </form>

    </main>

    <!-- Rodapé -->
    <footer>

        CyberShield © 2026

    </footer>

    <script>

        const form =
            document.getElementById("cadastroForm");

        const msg =
            document.getElementById("msg");

        const cpfInput =
            document.getElementById("cpf");

        const cepInput =
            document.getElementById("cep");

        const cpfMsg =
            document.getElementById("cpfMsg");

        const cepMsg =
            document.getElementById("cepMsg");

        // Valida CPF
        function validarCPF(cpf) {

            cpf = cpf.replace(/\D/g, "");

            if (cpf.length !== 11)
                return false;

            if (/^(\d)\1+$/.test(cpf))
                return false;

            let soma = 0;

            for (let i = 0; i < 9; i++) {

                soma += parseInt(cpf[i]) * (10 - i);

            }

            let resto = (soma * 10) % 11;

            if (resto === 10 || resto === 11)
                resto = 0;

            if (resto != cpf[9])
                return false;

            soma = 0;

            for (let i = 0; i < 10; i++) {

                soma += parseInt(cpf[i]) * (11 - i);

            }

            resto = (soma * 10) % 11;

            if (resto === 10 || resto === 11)
                resto = 0;

            return resto == cpf[10];

        }

        // Formata e valida CPF
        cpfInput.addEventListener("input", () => {

            let valor =
                cpfInput.value.replace(/\D/g, "");

            valor =
                valor.replace(/(\d{3})(\d)/, "$1.$2");

            valor =
                valor.replace(/(\d{3})(\d)/, "$1.$2");

            valor =
                valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

            cpfInput.value = valor;

            const cpfLimpo =
                valor.replace(/\D/g, "");

            if (cpfLimpo.length < 11) {

                cpfMsg.innerText =
                    "CPF incompleto";

                cpfMsg.className =
                    "invalido";

                return;

            }

            if (validarCPF(valor)) {

                cpfMsg.innerText =
                    "CPF válido";

                cpfMsg.className =
                    "valido";

            } else {

                cpfMsg.innerText =
                    "CPF inválido";

                cpfMsg.className =
                    "invalido";

            }

        });

        // Formata CEP
        cepInput.addEventListener("input", () => {

            let cep =
                cepInput.value.replace(/\D/g, "");

            cep =
                cep.replace(
                    /(\d{5})(\d)/,
                    "$1-$2"
                );

            cepInput.value = cep;

            const cepLimpo =
                cep.replace(/\D/g, "");

            if (cepLimpo.length < 8) {

                cepMsg.innerText =
                    "CEP incompleto";

                cepMsg.className =
                    "invalido";

                return;

            }

            buscarCEP(cepLimpo);

        });

        // Busca informações do CEP
        async function buscarCEP(cep) {

            try {

                const resposta =
                    await fetch(
                        `https://viacep.com.br/ws/${cep}/json/`
                    );

                const dados =
                    await resposta.json();

                if (dados.erro) {

                    cepMsg.innerText =
                        "CEP inválido";

                    cepMsg.className =
                        "invalido";

                    return;

                }

                cepMsg.innerText =
                    "CEP válido";

                cepMsg.className =
                    "valido";

                endereco.value =
                    dados.logradouro || "";

                bairro.value =
                    dados.bairro || "";

                cidade.value =
                    dados.localidade || "";

                uf.value =
                    dados.uf || "";

            }

            catch {

                cepMsg.innerText =
                    "Erro ao consultar CEP";

                cepMsg.className =
                    "invalido";

            }

        }

        // Cadastro do usuário
        form.addEventListener("submit", (e) => {

            e.preventDefault();

            msg.innerText = "";

            if (
                cpfMsg.className !== "valido" ||
                cepMsg.className !== "valido"
            ) {

                msg.innerText =
                    "Corrija os campos inválidos";

                return;

            }

            const senha =
                document.getElementById("senha").value;

            const confirmar =
                document.getElementById("confirmar").value;

            if (senha !== confirmar) {

                msg.innerText =
                    "As senhas não coincidem";

                return;

            }

            const usuarios =
                JSON.parse(
                    localStorage.getItem("usuarios")
                ) || [];

            if (
                usuarios.find(
                    usuario => usuario.cpf === cpfInput.value
                )
            ) {

                msg.innerText =
                    "CPF já cadastrado";

                return;

            }

            const novoUsuario = {

                nome:
                    nome.value,

                cpf:
                    cpfInput.value,

                cep:
                    cepInput.value,

                endereco:
                    endereco.value,

                bairro:
                    bairro.value,

                cidade:
                    cidade.value,

                uf:
                    uf.value,

                numero:
                    numero.value,

                complemento:
                    complemento.value,

                senha:
                    senha

            };

            usuarios.push(novoUsuario);

            localStorage.setItem(
                "usuarios",
                JSON.stringify(usuarios)
            );

            // Faz login automaticamente
            localStorage.setItem(
                "usuarioLogado",
                JSON.stringify({
                    nome: novoUsuario.nome,
                    cpf: novoUsuario.cpf
                })
            );

            alert(
                "Cadastro realizado com sucesso!"
            );

            window.location =
                "index.html";

        });

    </script>

</body>

</html>
