<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberShield - Minha Conta</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <a href="index.html" class="logo">
            CyberShield
        </a>

        <nav>

            <a href="index.html">Início</a>

            <a href="servicos.html">Serviços</a>

            <a href="conta.html">Conta</a>

        </nav>

    </header>

    <!-- Conteúdo principal -->
    <main>

        <div class="form-container">

            <form>

                <h1>Minha Conta</h1>

                <input
                    type="text"
                    id="nomeUsuario"
                    readonly>

                <input
                    type="text"
                    id="cpfUsuario"
                    readonly>

                <div id="mensagem"></div>

                <div class="account-actions">

                    <!-- Alterar informações -->

                    <button
                        type="button"
                        id="abrirEditar">

                        Alterar Informações

                    </button>

                    <div
                        class="action-panel"
                        id="painelEditar">

                        <input
                            type="text"
                            id="nome">

                        <input
                            type="text"
                            id="cep"
                            maxlength="9">

                        <input
                            type="text"
                            id="endereco"
                            readonly>

                        <input
                            type="text"
                            id="bairro"
                            readonly>

                        <input
                            type="text"
                            id="cidade"
                            readonly>

                        <input
                            type="text"
                            id="uf"
                            readonly>

                        <input
                            type="text"
                            id="numero"
                            placeholder="Número">

                        <input
                            type="text"
                            id="complemento"
                            placeholder="Complemento">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Nova senha (opcional)">

                        <button
                            type="button"
                            id="salvarBtn">

                            Salvar Alterações

                        </button>

                    </div>

                    <!-- Logout -->

                    <button
                        type="button"
                        class="warning-btn"
                        id="abrirLogout">

                        Encerrar Sessão

                    </button>

                    <div
                        class="action-panel"
                        id="painelLogout">

                        <p>
                            Deseja realmente sair da conta?
                        </p>

                        <br>

                        <button
                            type="button"
                            id="cancelarLogout">

                            Cancelar

                        </button>

                        <button
                            type="button"
                            id="confirmarLogout">

                            Sair

                        </button>

                    </div>

                    <!-- Excluir conta -->

                    <button
                        type="button"
                        class="danger-btn"
                        id="abrirDelete">

                        Excluir Conta

                    </button>

                    <div
                        class="action-panel"
                        id="painelDelete">

                        <p>
                            Esta ação é permanente.
                        </p>

                        <br>

                        <input
                            type="text"
                            id="cpfDelete"
                            placeholder="Confirme seu CPF">

                        <input
                            type="password"
                            id="senhaDelete"
                            placeholder="Confirme sua senha">

                        <button
                            type="button"
                            id="validarDelete">

                            Validar Dados

                        </button>

                        <div
                            id="deleteArea"
                            style="display:none;">

                            <p>
                                Sua conta será removida em:
                            </p>

                            <div
                                class="delete-timer"
                                id="contador">

                                10

                            </div>

                            <button
                                type="button"
                                id="cancelarDelete">

                                Cancelar Exclusão

                            </button>

                        </div>

                    </div>

                </div>

            </form>

        </div>

    </main>

    <footer>

        CyberShield © 2026

    </footer>

    <script>

        const sessao =
        JSON.parse(
            localStorage.getItem(
                "usuarioLogado"
            )
        );

        if(!sessao){

            window.location =
            "login.html";

        }

        const usuarios =
        JSON.parse(
            localStorage.getItem(
                "usuarios"
            )
        ) || [];

        const usuario =
        usuarios.find(
            u => u.cpf === sessao.cpf
        );

        if(!usuario){

            localStorage.removeItem(
                "usuarioLogado"
            );

            window.location =
            "login.html";

        }

        nomeUsuario.value =
        usuario.nome;

        cpfUsuario.value =
        usuario.cpf;

        nome.value =
        usuario.nome;

        cep.value =
        usuario.cep;

        endereco.value =
        usuario.endereco;

        bairro.value =
        usuario.bairro;

        cidade.value =
        usuario.cidade;

        uf.value =
        usuario.uf;

        numero.value =
        usuario.numero;

        complemento.value =
        usuario.complemento;

        const mensagem =
        document.getElementById(
            "mensagem"
        );

        function abrirPainel(id){

            document
            .querySelectorAll(
                ".action-panel"
            )
            .forEach(
                painel => {

                painel.classList.remove(
                    "active"
                );

            });

            document
            .getElementById(id)
            .classList.add(
                "active"
            );

        }

        abrirEditar.onclick =
        () => abrirPainel(
            "painelEditar"
        );

        abrirLogout.onclick =
        () => abrirPainel(
            "painelLogout"
        );

        abrirDelete.onclick =
        () => abrirPainel(
            "painelDelete"
        );

        cep.addEventListener(
            "input",
            () => {

            let valor =
            cep.value.replace(
                /\D/g,
                ""
            );

            valor =
            valor.replace(
                /(\d{5})(\d)/,
                "$1-$2"
            );

            cep.value =
            valor;

            const limpo =
            valor.replace(
                /\D/g,
                ""
            );

            if(
                limpo.length === 8
            ){

                buscarCEP(
                    limpo
                );

            }

        });

        async function buscarCEP(cepDigitado){

            try{

                const resposta =
                await fetch(
                    `https://viacep.com.br/ws/${cepDigitado}/json/`
                );

                const dados =
                await resposta.json();

                if(dados.erro){

                    return;

                }

                endereco.value =
                dados.logradouro || "";

                bairro.value =
                dados.bairro || "";

                cidade.value =
                dados.localidade || "";

                uf.value =
                dados.uf || "";

            }

            catch{}

        }

        salvarBtn.onclick =
        () => {

            usuario.nome =
            nome.value;

            usuario.cep =
            cep.value;

            usuario.endereco =
            endereco.value;

            usuario.bairro =
            bairro.value;

            usuario.cidade =
            cidade.value;

            usuario.uf =
            uf.value;

            usuario.numero =
            numero.value;

            usuario.complemento =
            complemento.value;

            if(
                senha.value.trim()
                !== ""
            ){

                usuario.senha =
                senha.value;

            }

            localStorage.setItem(
                "usuarios",
                JSON.stringify(
                    usuarios
                )
            );

            localStorage.setItem(
                "usuarioLogado",
                JSON.stringify({

                    nome:
                    usuario.nome,

                    cpf:
                    usuario.cpf

                })
            );

            nomeUsuario.value =
            usuario.nome;

            mensagem.innerHTML =
            '<p class="valido">Alterações salvas com sucesso.</p>';

        };

        cancelarLogout.onclick =
        () => {

            painelLogout.classList.remove(
                "active"
            );

        };

        confirmarLogout.onclick =
        () => {

            localStorage.removeItem(
                "usuarioLogado"
            );

            window.location =
            "index.html";

        };

        let intervalo;
        let tempo = 10;

        validarDelete.onclick =
        () => {

            if(
                cpfDelete.value
                !== usuario.cpf
            ){

                mensagem.innerHTML =
                '<p class="erro">CPF incorreto.</p>';

                return;

            }

            if(
                senhaDelete.value
                !== usuario.senha
            ){

                mensagem.innerHTML =
                '<p class="erro">Senha incorreta.</p>';

                return;

            }

            deleteArea.style.display =
            "block";

            tempo = 10;

            contador.innerText =
            tempo;

            clearInterval(
                intervalo
            );

            intervalo =
            setInterval(() => {

                tempo--;

                contador.innerText =
                tempo;

                if(
                    tempo <= 0
                ){

                    clearInterval(
                        intervalo
                    );

                    const novosUsuarios =
                    usuarios.filter(
                        u => u.cpf !== usuario.cpf
                    );

                    localStorage.setItem(
                        "usuarios",
                        JSON.stringify(
                            novosUsuarios
                        )
                    );

                    localStorage.removeItem(
                        "usuarioLogado"
                    );

                    window.location =
                    "index.html";

                }

            },1000);

        };

        cancelarDelete.onclick =
        () => {

            clearInterval(
                intervalo
            );

            deleteArea.style.display =
            "none";

            mensagem.innerHTML =
            '<p class="valido">Exclusão cancelada.</p>';

        };

    </script>

</body>

</html>
